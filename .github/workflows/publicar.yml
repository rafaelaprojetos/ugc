# Publica o site no GitHub Pages a cada push na branch main.
#
# Ele descobre sozinho onde o site vai morar:
#   - endereço do GitHub (usuario.github.io/portfolio) → base /portfolio/
#   - domínio próprio configurado em Settings → Pages  → base /
# Você não precisa mexer em nada aqui.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite publicar na mão pelo botão "Run workflow"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # precisa vir ANTES do build: é daqui que sai o endereço do site
      - uses: actions/configure-pages@v5
        id: pages

      - run: npm ci

      - name: Construir o site
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_URL: ${{ steps.pages.outputs.origin }}
          # Cadastre em: Settings → Secrets and variables → Actions
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}
          VITE_HCAPTCHA_SITEKEY: ${{ secrets.VITE_HCAPTCHA_SITEKEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
